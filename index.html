<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حساب المطبوعات</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F2F6;--card:#fff;--ink:#1E1A24;--mute:#6C6578;--line:#DDD8E4;--main:#4A2C7A;--on:#fff;--gold:#D9A400;--bad:#B3372F;--ok:#1E7A4F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121A;--card:#1F1B27;--ink:#EEEAF3;--mute:#9C94AB;--line:#322C3D;--main:#B79AF0;--on:#1B1030;--gold:#F0BE2A;--bad:#E27066;--ok:#5CC590}}
:root[data-theme="dark"]{--bg:#15121A;--card:#1F1B27;--ink:#EEEAF3;--mute:#9C94AB;--line:#322C3D;--main:#B79AF0;--on:#1B1030;--gold:#F0BE2A;--bad:#E27066;--ok:#5CC590}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Readex Pro",Tahoma,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:20px;margin:4px 0 14px}
nav{display:flex;border-bottom:2px solid var(--line);margin-bottom:14px}
nav button{flex:1;background:none;border:0;padding:10px 4px;font:inherit;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
nav button.on{color:var(--main);border-color:var(--gold);font-weight:600}
section{display:none}section.on{display:block}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:8px}
input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button.p{width:100%;padding:11px;border:0;border-radius:8px;background:var(--main);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
button.s{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.pr{display:grid;grid-template-columns:auto 1fr 90px 100px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.pr input[type=checkbox]{width:20px;height:20px}
.pr .c{text-align:left;font-weight:600;font-size:13px;grid-column:1/-1;color:var(--mute);padding-right:26px}
.res div{display:flex;justify-content:space-between;padding:4px 0}
.res .big{font-size:20px;font-weight:600;color:var(--main);border-top:2px solid var(--gold);margin-top:6px;padding-top:8px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}.it small{color:var(--mute);display:block}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.empty{color:var(--mute);text-align:center;padding:14px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.sum small{display:block;color:var(--mute);font-size:12px}
.tools{display:flex;gap:8px;justify-content:center;margin-top:18px}
.pr input[type=checkbox]{width:22px;height:22px}
@media(max-width:600px){main{padding:12px 10px 40px}body{font-size:16px}label{font-size:14px}input,select{font-size:16px;padding:12px}button.p{padding:14px;font-size:16px}button.s{padding:9px 14px;font-size:14px}nav button{padding:12px 2px;font-size:15px}.gr{grid-template-columns:auto 1fr 1fr!important}.gr>span:first-of-type{grid-column:2/-1}.gr>input[type=text]{grid-column:1/3}.gr>select{grid-column:3}.it{flex-wrap:wrap}.res>div{font-size:16px}.res .big{font-size:22px}}
#inv{position:fixed;inset:0;z-index:9;background:var(--bg);overflow:auto;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#invbody{background:#fff;color:#111;max-width:700px;margin:0 auto;padding:22px;border-radius:8px;font-size:16px}
#invbody h2{outline:none}
@media print{body>*:not(#inv){display:none!important}#inv{position:static;padding:0;background:#fff;overflow:visible}.noprint{display:none!important}#invbody{max-width:none;padding:0;border-radius:0}}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.st>div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;font-size:13px}.st b{font-size:15px}@media(max-width:600px){.st{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main>
<h1>حساب المطبوعات</h1>
<nav id="nav"><button data-t="calc" class="on">حاسبة الشغلة</button><button data-t="jobs">الشغلات</button></nav>

<section id="calc" class="on">
<div class="box">
<div class="row">
<label>اسم الشغلة<input id="jn" placeholder="مثلاً: علب عطور"></label>
<label>الزبون<input id="jc"></label>
</div>
<div style="display:flex;gap:6px;align-items:end;margin-bottom:8px"><label style="flex:1;margin:0">رقم هاتف الزبون<input id="jp" type="text" inputmode="tel"></label><button class="s" type="button" data-paste="jp" style="height:46px">لصق</button><button class="s" type="button" data-copyid="jp" style="height:46px">نسخ</button></div>
<label>المحافظة<select id="jg"><option value="">اختر المحافظة</option><option>بغداد</option><option>البصرة</option><option>نينوى</option><option>أربيل</option><option>السليمانية</option><option>دهوك</option><option>كركوك</option><option>الأنبار</option><option>ديالى</option><option>صلاح الدين</option><option>بابل</option><option>كربلاء</option><option>النجف</option><option>القادسية</option><option>واسط</option><option>ميسان</option><option>ذي قار</option><option>المثنى</option><option>حلبجة</option></select></label>
<div style="display:flex;gap:6px;align-items:end;margin-bottom:8px"><label style="flex:1;margin:0">العنوان<input id="jad" type="text"></label><button class="s" type="button" data-paste="jad" style="height:46px">لصق</button><button class="s" type="button" data-copyid="jad" style="height:46px">نسخ</button></div>
<div class="row">
<label>عدد القطع المطلوبة<input id="qty" type="text" min="1" value="1000" inputmode="numeric"></label>
<label>كم قطعة تطلع من الورقة<input id="per" type="text" min="1" value="4" inputmode="numeric"></label>
</div>
<div class="tot" id="sheets" style="font-weight:600"></div>
</div>

<div class="box">
<div style="font-size:13px;color:var(--mute)">فعّل العمليات المطلوبة واكتب سعرها. الأسعار تنحفظ تلقائياً للشغلة الجاية.</div>
<div id="procs"></div>
</div>

<div class="box">
<label>الربح (مبلغ بالدينار)<input id="margin" type="text" inputmode="decimal" value="0"></label>
<div class="res" id="res"></div>
<div class="row" style="margin-top:10px">
<label>المقدم المدفوع<input id="adv" type="text" min="0" value="0" inputmode="numeric"></label>
<label>&nbsp;<button class="p" id="save" style="margin-top:0">احفظ الشغلة</button></label>
</div>
<button class="s" id="invbtn" style="width:100%;padding:12px;margin-top:10px">فاتورة للزبون (بدون أسعار التفاصيل)</button>
</div>
<button class="s" id="reset" style="width:100%;padding:12px">تصفير كل المدخلات</button>
</section>

<section id="jobs">
<div class="sum"><div><small>مجموع الشغلات</small><b id="t1">0</b></div><div><small>المتبقي على الزبائن</small><b id="t2" class="bad">0</b></div></div>
<div class="box" id="jl"></div>
<div class="tools"><button class="s" id="exp">نسخة احتياطية</button><button class="s" id="imp">استرجاع نسخة</button><input type="file" id="file" accept="application/json" hidden></div>
</section>
</main>
<div id="inv" hidden><div class="noprint" style="display:flex;gap:8px;max-width:700px;margin:0 auto 10px"><button class="p" id="invprint">طباعة</button><button class="s" id="invclose" style="min-width:90px">إغلاق</button></div><div class="noprint" id="invsel" style="max-width:700px;margin:0 auto 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px"></div><div id="invbody"></div></div>
<script>
function fixD(s){return String(s).replace(/[\u0660-\u0669]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[\u06F0-\u06F9]/g,function(c){return c.charCodeAt(0)-1776}).replace(/\u066B/g,".").replace(/\u066C/g,"")}
function num(v){return parseFloat(String(v).replace(/,/g,""))||0}
function fmtEl(t){if(!t||t.tagName!=="INPUT"||!/numeric|decimal/.test(t.getAttribute("inputmode")||""))return;var v=fixD(t.value),pos=t.selectionStart||0,left=v.slice(0,pos).replace(/[^0-9.]/g,"").length,c=v.replace(/[^0-9.]/g,""),p=c.split("."),out=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,",")+(p.length>1?"."+p.slice(1).join(""):"");if(out!==v){t.value=out;var k=0,i=0;for(;i<out.length&&k<left;i++){if(/[0-9.]/.test(out[i]))k++}try{t.setSelectionRange(i,i)}catch(x){}}}
document.addEventListener("input",function(e){fmtEl(e.target)},true);
function fixEl(t){if(t&&typeof t.value==="string"&&t.type!=="checkbox"&&t.type!=="file"){var v=fixD(t.value);if(v!==t.value){var s=t.selectionStart;t.value=v;try{t.setSelectionRange(s,s)}catch(x){}return true}}return false}
["input","compositionend","keyup","change","blur"].forEach(function(ev){document.addEventListener(ev,function(e){if(fixEl(e.target)&&ev!=="input")e.target.dispatchEvent(new Event("input",{bubbles:true}))},true)});
document.addEventListener("beforeinput",function(e){var t=e.target;if(e.data&&e.inputType==="insertText"&&fixD(e.data)!==e.data&&t.setRangeText){e.preventDefault();t.setRangeText(fixD(e.data),t.selectionStart,t.selectionEnd,"end");t.dispatchEvent(new Event("input",{bubbles:true}))}},true);
var _pr=window.prompt;window.prompt=function(){var r=_pr.apply(window,arguments);return r==null?r:fixD(r).replace(/,/g,"")};
</script>
<script>
var KEY="print-costing-v1";
var PROCS=[["paper","الورق","sheet",0,1],["print","الطبع","bundle5",0,1],["plate","البليت","fixed",0,0],["cut","القص","fixed",0,0],["die","القالب","fixed",0,0],["lam","السلفان","sheet",0,0],["glue","اللصق","piece",0,0],["uv","السبوت يوفي","sheet",0,0],["foil","التذهيب (فويل)","sheet",0,0]];
var S={rates:{},jobs:[]};
PROCS.forEach(function(p){S.rates[p[0]]={on:!!p[4],price:p[3],basis:p[2]}});
S.rates.extra={on:false,price:0,basis:"fixed"};
S.paper={usd:0,pack:0,rate:1700,mode:"bundle",w:0,l:0,gsm:0,tp:0,unit:"ton"};
try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);S.jobs=d.jobs||[];for(var k in d.rates)S.rates[k]=d.rates[k];if(d.paper)Object.assign(S.paper,d.paper)}}catch(e){}
if(!S.k1){if(S.rates.print.basis==="sheet")S.rates.print.basis="k1000";S.k1=1}
if(!S.k2){if(S.rates.print.basis==="k1000"||S.rates.print.basis==="sheet")S.rates.print.basis="bundle";S.k2=1}
if(!S.k3){if(S.rates.print.basis==="bundle")S.rates.print.basis="bundle5";S.k3=1}
function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.remoteSave)remoteSave()}
S.form=S.form||{};
if(!S.k4){if(!S.paper.rate)S.paper.rate=1700;S.k4=1}
var $=function(i){return document.getElementById(i)};
function esc(t){var d=document.createElement("div");d.textContent=fixD(t);return d.innerHTML}
function n(v){return Math.round(v).toLocaleString("en-US")}
function isTwo(r){return r.sides?r.sides==="2":!!r.two}
function nf(v){return (Math.round(v*100)/100).toLocaleString("en-US",{maximumFractionDigits:2})}
var ALL=PROCS.concat([["extra","مصاريف أخرى (تصميم، نقل...)","fixed",0,0]]);
var BASIS={sheet:"لكل ورقة",piece:"لكل قطعة",bundle5:"لكل 5 بند",bundle:"لكل بند",k1000:"لكل 1000 وزقة",fixed:"مبلغ ثابت"};
var cur={};

function paperBox(){var P=S.paper;function f(l,k,m){return '<label>'+l+'<input type="text" inputmode="'+(m||"decimal")+'" data-p="'+k+'" value="'+(P[k]||"")+'"></label>'}
var g='display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:6px';
function o(v,t,k){return '<option value="'+v+'"'+(P[k]===v?" selected":"")+'>'+t+'</option>'}
return '<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>الورق</b>'+
'<label style="margin-top:6px">طريقة حساب الورق<select data-p="mode">'+o("bundle","بالبند (سعر البند وعدد أوراقه)","mode")+o("weight","بالوزن (القياس × الوزن × السعر)","mode")+'</select></label>'+
'<div style="'+g+'">'+f("سعر الدولار اليوم (بالدينار)","rate","numeric")+f("عدد الأوراق بالبند","pack","numeric")+f("وزن الكارتون (غم)","gsm","numeric")+'</div>'+
'<div id="pb_bundle" style="'+g+'">'+f("سعر البند بالدولار ($)","usd")+'</div>'+
'<div id="pb_weight" style="'+g+'">'+f("عرض الورقة (سم)","w")+f("طول الورقة (سم)","l")+f("سعر الطن بالدولار ($)","tp")+'</div>'+
'<div id="c_paper2" style="font-weight:600;font-size:15px;color:var(--main);margin-top:4px;white-space:pre-line"></div><div id="c_paper" style="font-weight:600;font-size:13px;color:var(--mute)"></div></div>'}
function lamBox(r){function lf(l,k){return '<label style="margin:0">'+l+'<input type="text" inputmode="decimal" data-k="lam" data-f="'+k+'" value="'+(r[k]||"")+'"></label>'}
return '<div class="pr" style="grid-template-columns:auto 1fr"><input type="checkbox" data-k="lam" data-f="on"'+(r.on?' checked':'')+' aria-label="السلفان"><span>السلفان</span><div style="grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px">'+lf("عرض الورقة (سم)","wid")+lf("طول الورقة (سم)","len")+lf("السعر","price")+lf("مبلغ ثابت إضافي","fix")+'</div><label style="grid-column:1/-1;margin:0">السلفان<select data-k="lam" data-f="sides"><option value="1"'+(isTwo(r)?'':' selected')+'>وجه واحد</option><option value="2"'+(isTwo(r)?' selected':'')+'>وجهين (السعر × 2)</option></select></label><div class="c" id="c_lam"></div></div>'}
function simpleBox(id,nm,r){return '<div class="pr" style="grid-template-columns:auto 1fr 140px"><input type="checkbox" data-k="'+id+'" data-f="on"'+(r.on?' checked':'')+' aria-label="'+nm+'"><span>'+nm+'</span><input type="text" inputmode="decimal" placeholder="السعر" data-k="'+id+'" data-f="price" value="'+(r.price||"")+'"><div class="c" id="c_'+id+'"></div></div>'}
function buildProcs(){
 $("procs").innerHTML=ALL.map(function(p){var r=S.rates[p[0]],id=p[0];if(id==="paper")return paperBox();if(id==="lam")return lamBox(r);if(id==="plate"||id==="cut"||id==="die")return simpleBox(id,p[1],r);
  return '<div class="pr gr"><input type="checkbox" data-k="'+id+'" data-f="on"'+(r.on?' checked':'')+' aria-label="'+p[1]+'"><span>'+p[1]+'</span>'+
  '<input type="text" min="0" inputmode="decimal" value="'+(r.price||"")+'" placeholder="السعر" data-k="'+id+'" data-f="price">'+
  (id==="paper"?'<span style="font-size:13px;color:var(--mute)">لكل ورقة</span>':'<select data-k="'+id+'" data-f="basis">'+Object.keys(BASIS).map(function(b){return '<option value="'+b+'"'+(r.basis===b?' selected':'')+'>'+BASIS[b]+'</option>'}).join("")+'</select>')+
  (id==="print"?'<input type="text" inputmode="decimal" placeholder="مبلغ ثابت إضافي (اختياري)" data-k="print" data-f="fix" value="'+(r.fix||"")+'" style="grid-column:1/-1">':"")+'<div class="c" id="c_'+id+'"></div>'+'</div>'}).join("");
}
function calc(){
 var q=num($("qty").value),per=Math.max(1,num($("per").value)||1);
 var half=false,sheets=Math.ceil(q/per),psheets=half?Math.ceil(sheets/2):sheets;
 $("sheets").textContent="عدد الأوراق المطلوبة: "+n(sheets);
 var cost=0,lines=[],det=[];
 ALL.forEach(function(p){var r=S.rates[p[0]],c=0;
  if(p[0]==="paper"){var P=S.paper,d2=function(x){return x.toLocaleString("en-US",{maximumFractionDigits:2})},msg="";
$("pb_bundle").style.display=P.mode==="bundle"?"grid":"none";$("pb_weight").style.display=P.mode==="weight"?"grid":"none";
if(P.mode==="weight"){var usd=P.w*P.l*P.gsm*P.tp/1e10,u=usd*P.rate;c=sheets*u;
msg=c?"("+d2(P.w)+" × "+d2(P.l)+" × "+d2(P.gsm)+" × "+d2(P.tp)+") ÷ 10,000,000,000 = $"+d2(usd)+" للورقة × "+d2(P.rate)+" = "+n(u)+" د.ع · "+n(sheets)+" ورقة"+" = "+n(c):(!(P.w&&P.l&&P.gsm&&P.tp)?"اكتب القياس والوزن والسعر":(!P.rate?"اكتب سعر الدولار":""))}
else{var u2=P.pack?P.usd/P.pack*P.rate:0;c=sheets*u2;
msg=c?"سعر الورقة = ("+d2(P.usd)+" ÷ "+d2(P.pack)+") × "+d2(P.rate)+" = "+n(u2)+" د.ع · "+n(sheets)+" ورقة = "+n(c):(P.usd&&!P.rate?"اكتب سعر الدولار حتى يحسب سعر الورق":(P.usd&&!P.pack?"اكتب عدد الأوراق بالبند":""))}
$("c_paper").textContent=msg;if(P.gsm)det.push({k:"gsm",t:"وزن الكارتون: "+d2(P.gsm)+" غم"});var pt=[];if(P.pack&&sheets)pt.push("عدد البنود المطلوبة: "+d2(sheets/P.pack)+" بند ("+n(sheets)+" ÷ "+d2(P.pack)+")");if(P.mode==="weight"&&P.pack&&c)pt.push("سعر البند الواحد ("+d2(P.pack)+" ورقة): "+n(u*P.pack)+" د.ع ($"+d2(usd*P.pack)+")");$("c_paper2").textContent=pt.join("\n")}else if(r.on){var pm=(p[0]==="print"&&half)?2:1,m=r.basis==="bundle5"?(S.paper.pack?Math.ceil(Math.round((p[0]==="print"?psheets:sheets)/S.paper.pack/5*1e6)/1e6):0):r.basis==="bundle"?(S.paper.pack?(p[0]==="print"?psheets:sheets)/S.paper.pack:0):r.basis==="k1000"?Math.ceil((p[0]==="print"?psheets:sheets)/1000):r.basis==="sheet"?(p[0]==="print"?psheets:sheets):r.basis==="piece"?q:1;c=(p[0]==="plate"||p[0]==="cut"||p[0]==="die")?(+r.price||0):p[0]==="lam"?(r.wid||0)*(r.len||0)*(+r.price||0)*sheets*(isTwo(r)?2:1)/1000:(+r.price||0)*pm*m}
  if(r.on&&(p[0]==="print"||p[0]==="lam"))c+=(+r.fix||0);
  if(p[0]!=="paper")$("c_"+p[0]).textContent=r.on&&c?"= "+n(c)+((p[0]==="print"||p[0]==="lam")&&+r.fix?" (يشمل ثابت "+nf(+r.fix)+")":"")+(p[0]==="lam"?" ("+(r.wid||0)+" × "+(r.len||0)+" × "+(r.price||0)+" × "+n(sheets)+" ورقة"+(isTwo(r)?" × 2 وجهين":"")+" ÷ 1,000)":"")+(p[0]==="print"&&r.basis==="bundle5"&&S.paper.pack?" ("+(Math.round(psheets/S.paper.pack*100)/100)+" بند ÷ 5 = "+Math.ceil(Math.round(psheets/S.paper.pack/5*1e6)/1e6)+" وحدة)":"")+(p[0]==="print"&&r.basis==="bundle"&&S.paper.pack?" ("+(Math.round(psheets/S.paper.pack*100)/100)+" بند)":"")+(p[0]==="print"&&r.basis==="k1000"?" ("+(S.paper.pack?(Math.round(psheets/S.paper.pack*100)/100)+" بند = ":"")+n(psheets)+" وزقة = "+n(Math.ceil(psheets/1000))+" وحدة)":"")+(p[0]==="print"&&half?" (نص بطال: "+n(psheets)+" ورقة، السعر × 2)":""):"";
